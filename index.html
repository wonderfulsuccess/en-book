<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝民小学 Simi 音频乐园</title>
  <style>
    :root {
      color-scheme: light;
      --bg: linear-gradient(180deg, #fdf3ff 0%, #f1fcff 100%);
      --primary: #ff7a59;
      --primary-dark: #ff4c2a;
      --accent: #5ec2ff;
      --accent-dark: #0090e0;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #303030;
      --muted: #606060;
      font-size: clamp(16px, 2.4vw, 20px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Marker Felt", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2.5rem;
    }

    h1 {
      margin: 0.5rem 0 1rem;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      text-align: center;
      color: var(--primary);
      text-shadow: 0 4px 0 rgba(0,0,0,0.1);
      letter-spacing: 0.05em;
    }

    .card {
      width: min(640px, 100%);
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    label {
      font-weight: 600;
      font-size: 1rem;
      color: var(--muted);
    }

    select {
      border: 3px solid var(--accent);
      border-radius: 18px;
      padding: 0.8rem 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-dark);
      background: #fff;
      box-shadow: inset 0 3px 0 rgba(94, 194, 255, 0.3);
      appearance: none;
    }

    .play-toggle {
      padding: 1.3rem;
      font-size: clamp(1.6rem, 6vw, 2.5rem);
      border: none;
      border-radius: 50px;
      background: radial-gradient(circle at top, #ffd36b 0%, #ffaf2d 100%);
      color: #7b3600;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 0 #e38a02, 0 18px 35px rgba(255, 175, 45, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-toggle:active {
      transform: translateY(5px);
      box-shadow: 0 6px 0 #e38a02, 0 10px 20px rgba(255, 175, 45, 0.45);
    }

    .skip-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .skip-button {
      padding: 1.1rem;
      border-radius: 20px;
      border: none;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .skip-button[data-shift="3"] {
      background: linear-gradient(135deg, #65e2a4 0%, #19b87d 100%);
      box-shadow: 0 10px 0 #119260;
    }

    .skip-button[data-shift="-3"] {
      background: linear-gradient(135deg, #ff8bd0 0%, #ff57ae 100%);
      box-shadow: 0 10px 0 #e51486;
    }

    .skip-button[data-shift="5"] {
      background: linear-gradient(135deg, #67a5ff 0%, #2b75ff 100%);
      box-shadow: 0 10px 0 #1e57c8;
    }

    .skip-button[data-shift="-5"] {
      background: linear-gradient(135deg, #ff7373 0%, #ff3838 100%);
      box-shadow: 0 10px 0 #d41515;
    }

    .skip-button:active {
      transform: translateY(4px);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
    }

    .now-playing {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .card {
        padding: 1.2rem;
      }

      .skip-group {
        grid-template-columns: repeat(2, 1fr);
      }

      .skip-button {
        font-size: 1.1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>宝民小学 Simi 音频乐园</h1>
  <main class="card">
    <div class="selector">
      <label for="audioSelect">选择音频：</label>
      <select id="audioSelect" aria-label="选择想要收听的音频">
      </select>
    </div>

    <div class="now-playing" id="nowPlaying">请选择要播放的音频</div>

    <button class="play-toggle" id="playToggle" type="button">▶ 开始播放</button>

    <div class="skip-group">
      <button class="skip-button" data-shift="-3" type="button">↩ 后退3秒</button>
      <button class="skip-button" data-shift="3" type="button">↪ 前进3秒</button>
      <button class="skip-button" data-shift="-5" type="button">⏪ 后退5秒</button>
      <button class="skip-button" data-shift="5" type="button">⏩ 前进5秒</button>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
  </main>

  <footer class="footer">网页所有权归 宝民小学 Simi 所有</footer>

  <script>
    (function () {
      const audioFiles = [
        { file: "01_2AUnit_1.mp3", name: "Unit 1 快乐课堂" },
        { file: "02_2AUnit_2.mp3", name: "Unit 2 小小冒险" },
        { file: "03_2AUnit_3.mp3", name: "Unit 3 欢乐时刻" },
        { file: "04_2AUnit_4.mp3", name: "Unit 4 趣味探索" },
        { file: "05_2AUnit_5.mp3", name: "Unit 5 魔法英语" },
        { file: "06_2AUnit_6.mp3", name: "Unit 6 快乐假期" },
        { file: "07_2AWord_list.mp3", name: "单词大挑战" }
      ];

      const STORAGE_KEY = "simiAudioProgress";

      const audioPlayer = document.getElementById("audioPlayer");
      const audioSelect = document.getElementById("audioSelect");
      const nowPlaying = document.getElementById("nowPlaying");
      const playToggle = document.getElementById("playToggle");
      const skipButtons = document.querySelectorAll(".skip-button");

      let savedState = null;
      let lastSavedTime = 0;

      function populateSelect() {
        audioSelect.innerHTML = "";
        audioFiles.forEach(({ file, name }) => {
          const option = document.createElement("option");
          option.value = file;
          option.textContent = name;
          audioSelect.appendChild(option);
        });
      }

      function loadSavedState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          savedState = raw ? JSON.parse(raw) : null;
        } catch (err) {
          savedState = null;
        }
      }

      function saveState(time) {
        if (!audioPlayer.src) return;
        const state = {
          file: audioSelect.value,
          time: Math.max(0, Math.min(audioPlayer.duration || time || 0, time || 0))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        lastSavedTime = state.time;
      }

      function setAudioSource(file) {
        const src = `audio/${file}`;
        audioPlayer.src = src;
        audioPlayer.load();
        nowPlaying.textContent = `正在播放：${audioSelect.options[audioSelect.selectedIndex].text}`;
        playToggle.textContent = "▶ 开始播放";
        playToggle.dataset.state = "paused";
      }

      function initializeFromSaved() {
        if (!savedState) return;
        const index = audioFiles.findIndex(item => item.file === savedState.file);
        if (index >= 0) {
          audioSelect.value = savedState.file;
          setAudioSource(savedState.file);
        }
      }

      function togglePlayback() {
        if (!audioPlayer.src) {
          setAudioSource(audioSelect.value);
        }
        if (audioPlayer.paused) {
          audioPlayer.play();
        } else {
          audioPlayer.pause();
        }
      }

      function updatePlayButton() {
        if (audioPlayer.paused) {
          playToggle.textContent = "▶ 开始播放";
          playToggle.dataset.state = "paused";
        } else {
          playToggle.textContent = "⏸ 暂停播放";
          playToggle.dataset.state = "playing";
        }
      }

      function seekBy(seconds) {
        if (!audioPlayer.src) {
          setAudioSource(audioSelect.value);
        }
        if (Number.isFinite(audioPlayer.duration)) {
          const target = Math.max(0, Math.min(audioPlayer.duration, audioPlayer.currentTime + seconds));
          audioPlayer.currentTime = target;
        }
        if (audioPlayer.paused) {
          audioPlayer.play().catch(() => {});
        }
      }

      populateSelect();
      loadSavedState();
      initializeFromSaved();

      audioSelect.addEventListener("change", () => {
        const { value } = audioSelect;
        setAudioSource(value);
        nowPlaying.textContent = `正在播放：${audioSelect.options[audioSelect.selectedIndex].text}`;
        saveState(0);
      });

      playToggle.addEventListener("click", togglePlayback);

      skipButtons.forEach(button => {
        button.addEventListener("click", () => {
          const shift = Number(button.dataset.shift);
          seekBy(shift);
        });
      });

      audioPlayer.addEventListener("play", updatePlayButton);
      audioPlayer.addEventListener("pause", updatePlayButton);

      audioPlayer.addEventListener("loadedmetadata", () => {
        if (
          savedState &&
          savedState.file === audioSelect.value &&
          typeof savedState.time === "number" &&
          savedState.time > 0 &&
          savedState.time < audioPlayer.duration
        ) {
          audioPlayer.currentTime = savedState.time;
        }
        nowPlaying.textContent = `正在播放：${audioSelect.options[audioSelect.selectedIndex].text}`;
      });

      audioPlayer.addEventListener("ended", () => {
        saveState(0);
        updatePlayButton();
      });

      audioPlayer.addEventListener("timeupdate", () => {
        if (!Number.isFinite(audioPlayer.duration)) return;
        if (Math.abs(audioPlayer.currentTime - lastSavedTime) >= 1) {
          saveState(audioPlayer.currentTime);
        }
      });

      if (!audioPlayer.src && audioFiles.length > 0) {
        setAudioSource(audioFiles[0].file);
        if (!savedState) {
          nowPlaying.textContent = `正在播放：${audioSelect.options[audioSelect.selectedIndex].text}`;
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          saveState(audioPlayer.currentTime);
        }
      });

      window.addEventListener("beforeunload", () => {
        saveState(audioPlayer.currentTime);
      });
    })();
  </script>
</body>
</html>
